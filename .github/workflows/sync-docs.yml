name: Sync Catalog UI to Catalog Branch

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:

permissions: {}

# Serialize the whole build/push/deploy lifecycle, including manual reruns.
# Do not cancel a run while it is publishing.
concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  sync-catalog:
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    name: Sync Catalog UI
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: main-repo
          persist-credentials: false

      - name: Checkout catalog branch
        uses: actions/checkout@v4
        with:
          ref: catalog
          path: catalog-repo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: main-repo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: main-repo

      - name: Build catalog UI
        run: npm run build
        working-directory: main-repo

      - name: Reject superseded source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"

      - name: Sync catalog UI files
        run: |
          # Sync built files from dist/ to catalog branch docs/
          # Vite compiles TypeScript to JavaScript in docs/dist/
          rsync -av --delete --exclude=CNAME --exclude=.nojekyll main-repo/docs/dist/ catalog-repo/docs/

      - name: Commit and push to catalog
        run: |
          cd catalog-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --staged --quiet; then
            echo "No changes to catalog UI, skipping commit"
          else
            git commit -m "Sync catalog UI from main branch

            Auto-synced catalog UI changes from main branch.

            Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"

            # Push with retry logic to handle concurrent pushes
            max_retries=5
            retry_count=0
            push_success=false

            while [ "$retry_count" -lt "$max_retries" ]; do
              if git push origin catalog; then
                echo "✓ Catalog UI synced to catalog branch"
                push_success=true
                break
              else
                retry_count=$((retry_count + 1))

                if [ "$retry_count" -lt "$max_retries" ]; then
                  echo "⚠ Push failed (attempt $retry_count/$max_retries), retrying..."

                  # Fetch and rebase
                  git fetch origin catalog

                  if git rebase origin/catalog; then
                    echo "Rebase successful, retrying push..."
                    # Exponential backoff with jitter
                    backoff=$((5 + retry_count * 3 + RANDOM % 5))
                    echo "Waiting ${backoff}s before retry..."
                    sleep "$backoff"
                  else
                    echo "✗ Rebase failed, aborting"
                    git rebase --abort
                    exit 1
                  fi
                fi
              fi
            done

            if [ "$push_success" = "false" ]; then
              echo "✗ Failed to push after $max_retries attempts"
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: catalog-repo/docs

  deploy:
    needs: sync-catalog
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify source and coordinated Pages transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          # Read only: the operator changes the publishing source after integration.
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

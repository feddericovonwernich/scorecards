name: Create Installation PR

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization/user name'
        required: true
        type: string
      repo:
        description: 'Repository name'
        required: true
        type: string
      scorecards-repo:
        description: 'Central scorecards repository (owner/repo)'
        required: false
        type: string
        default: 'feddericovonwernich/scorecards'
      scorecards-branch:
        description: 'Branch to commit results to in central repo'
        required: false
        type: string
        default: 'catalog'
      retry-closed:
        description: 'Create a new installation PR after a previous PR was closed'
        required: false
        type: boolean
        default: false

      request-id:
        description: 'Caller correlation identifier'
        required: false
        type: string

run-name: scorecards-install:${{ inputs.request-id || github.run_id }}


concurrency:
  group: scorecards-install-${{ inputs.org }}/${{ inputs.repo }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-owner:
    name: Validate Central Owner
    runs-on: ubuntu-latest
    steps:
      - name: Require central default branch
        env:
          GH_TOKEN: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
          SCORECARDS_REPO: ${{ inputs.scorecards-repo }}
        run: |
          [ "${GITHUB_REPOSITORY,,}" = "${SCORECARDS_REPO,,}" ] || {
            echo "This workflow must run in the requested central repository" >&2
            exit 1
          }
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [ "$GITHUB_REF" = "refs/heads/$default_branch" ] || {
            echo "This workflow must run from the central default branch" >&2
            exit 1
          }

  create-pr:
    needs: validate-owner
    name: Create Installation PR
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.result.outputs.pr-number }}
      pr-state: ${{ steps.result.outputs.pr-state }}
      pr-url: ${{ steps.result.outputs.pr-url }}
      status: ${{ steps.result.outputs.status }}
      message: ${{ steps.result.outputs.message }}
    steps:
      - name: Checkout target service repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.org }}/${{ inputs.repo }}
          token: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
          path: service-repo

      - name: Checkout scorecards repository for templates
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.scorecards-repo }}
          path: scorecards-repo
          ref: ${{ github.event.repository.default_branch }}

      - name: Check installation status
        id: check
        working-directory: service-repo
        env:
          GH_TOKEN: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
        run: |
          if [ -f ".github/workflows/scorecards.yml" ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "create-pr=false" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
            echo "pr-state=" >> "$GITHUB_OUTPUT"
            echo "pr-url=" >> "$GITHUB_OUTPUT"
            echo "status=already-installed" >> "$GITHUB_OUTPUT"
            echo "message=Scorecards is already installed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "installed=false" >> "$GITHUB_OUTPUT"
          pr_data=$(gh pr list \
            --repo "${{ inputs.org }}/${{ inputs.repo }}" \
            --label "scorecards-install" \
            --state open \
            --json number,state,title,headRefName,url \
            --limit 1)

          if [ "$pr_data" = "[]" ]; then
            pr_data=$(gh pr list \
              --repo "${{ inputs.org }}/${{ inputs.repo }}" \
              --label "scorecards-install" \
              --state all \
              --json number,state,title,headRefName,url \
              --limit 1)
          fi

          if [ "$pr_data" = "[]" ]; then
            echo "create-pr=true" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
            echo "pr-state=" >> "$GITHUB_OUTPUT"
            echo "pr-url=" >> "$GITHUB_OUTPUT"
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "message=No prior installation PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(echo "$pr_data" | jq -r '.[0].number')
          pr_state=$(echo "$pr_data" | jq -r '.[0].state')
          pr_url=$(echo "$pr_data" | jq -r '.[0].url')
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr-state=$pr_state" >> "$GITHUB_OUTPUT"
          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"

          if [ "$pr_state" = OPEN ]; then
            echo "create-pr=false" >> "$GITHUB_OUTPUT"
            echo "status=pr-exists" >> "$GITHUB_OUTPUT"
            echo "message=Installation PR already exists" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.retry-closed }}" = true ]; then
            echo "create-pr=true" >> "$GITHUB_OUTPUT"
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "message=Explicit retry requested" >> "$GITHUB_OUTPUT"
          else
            echo "create-pr=false" >> "$GITHUB_OUTPUT"
            echo "status=closed" >> "$GITHUB_OUTPUT"
            echo "message=Previous installation PR is ${pr_state,,}; retry-closed was not requested" >> "$GITHUB_OUTPUT"
          fi

      - name: Create installation branch and files
        id: prepare
        if: steps.check.outputs.create-pr == 'true'
        working-directory: service-repo
        run: |
          INSTALL_BRANCH="scorecards-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$INSTALL_BRANCH"

          mkdir -p .github/workflows .scorecard
          sed -e "s|feddericovonwernich/scorecards|${{ inputs.scorecards-repo }}|g" \
              -e "s|scorecards-branch: 'catalog'|scorecards-branch: '${{ inputs.scorecards-branch }}'|g" \
              ../scorecards-repo/documentation/examples/scorecard-workflow-template.yml > .github/workflows/scorecards.yml

          cat > .scorecard/config.yml << EOF
          service:
            name: "${{ inputs.repo }}"
            team: ""
            description: ""
            links: []
          EOF

          git add .github/workflows/scorecards.yml .scorecard/config.yml
          git commit -m "chore: Add Scorecards quality monitoring"
          git push -u origin "$INSTALL_BRANCH"
          echo "install-branch=$INSTALL_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.check.outputs.create-pr == 'true'
        id: create-pr
        working-directory: service-repo
        env:
          GH_TOKEN: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
          INSTALL_BRANCH: ${{ steps.prepare.outputs.install-branch }}
        run: |
          DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          [ -n "$DEFAULT_BRANCH" ] || DEFAULT_BRANCH=main
          cat > pr-body.md << 'EOF'
          ## Scorecards quality monitoring

          This PR adds the maintained Scorecards workflow and service configuration.
          Closing it is respected; a later retry requires `retry-closed: true`.
          EOF
          gh label create "scorecards-install" --description "Automated scorecards installation PR" --color "0366d6" 2>/dev/null || true
          pr_url=$(gh pr create \
            --repo "${{ inputs.org }}/${{ inputs.repo }}" \
            --title "chore: Add Scorecards quality monitoring" \
            --body-file pr-body.md \
            --label "scorecards-install" \
            --head "$INSTALL_BRANCH" \
            --base "$DEFAULT_BRANCH")
          pr_number="${pr_url##*/}"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr-state=OPEN" >> "$GITHUB_OUTPUT"
          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Set final outputs
        id: result
        if: always()
        run: |
          if [ -n "${{ steps.create-pr.outputs.pr-url }}" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=Installation PR created successfully" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ steps.create-pr.outputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-state=OPEN" >> "$GITHUB_OUTPUT"
            echo "pr-url=${{ steps.create-pr.outputs.pr-url }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=${{ steps.check.outputs.status }}" >> "$GITHUB_OUTPUT"
            echo "message=${{ steps.check.outputs.message }}" >> "$GITHUB_OUTPUT"
            echo "pr-number=${{ steps.check.outputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-state=${{ steps.check.outputs.pr-state }}" >> "$GITHUB_OUTPUT"
            echo "pr-url=${{ steps.check.outputs.pr-url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Display summary
        run: |
          echo "## Installation PR result" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository**: ${{ inputs.org }}/${{ inputs.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status**: ${{ steps.result.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.result.outputs.pr-url }}" ]; then
            echo "**PR**: ${{ steps.result.outputs.pr-url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
  publish-result:
    name: Publish Installation PR Result
    runs-on: ubuntu-latest
    needs: create-pr
    if: always()
    steps:
      - name: Write result
        env:
          STATUS: ${{ needs.create-pr.outputs.status }}
          MESSAGE: ${{ needs.create-pr.outputs.message }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr-number }}
          PR_STATE: ${{ needs.create-pr.outputs.pr-state }}
          PR_URL: ${{ needs.create-pr.outputs.pr-url }}
        run: |
          jq -n \
            --arg status "$STATUS" \
            --arg message "$MESSAGE" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_state "$PR_STATE" \
            --arg pr_url "$PR_URL" \
            '{status: $status, message: $message, pr_number: $pr_number, pr_state: $pr_state, pr_url: $pr_url}' \
            > installation-pr-result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: installation-pr-result-${{ inputs.request-id || github.run_id }}
          path: installation-pr-result.json

  update-registry:
    name: Update Registry with PR Info
    runs-on: ubuntu-latest
    needs: create-pr
    if: needs.create-pr.outputs.status == 'success' && needs.create-pr.outputs.pr-number != ''
    steps:
      - name: Checkout catalog branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.scorecards-branch }}
          token: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}

      - name: Fetch default branch
        id: fetch-branch
        env:
          GH_TOKEN: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/${{ inputs.org }}/${{ inputs.repo }}" --jq '.default_branch' 2>/dev/null || echo "main")
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "Default branch: $DEFAULT_BRANCH"

      - name: Update registry with PR information
        run: |
          REGISTRY_FILE="registry/${{ inputs.org }}/${{ inputs.repo }}.json"

          echo "Updating registry: $REGISTRY_FILE"

          # Create directory if it doesn't exist
          mkdir -p "registry/${{ inputs.org }}"

          # Check if registry file exists
          if [ -f "$REGISTRY_FILE" ]; then
            echo "Registry file exists, updating PR information..."

            # Update the installation_pr field using jq
            jq --arg pr_number "${{ needs.create-pr.outputs.pr-number }}" \
               --arg pr_state "${{ needs.create-pr.outputs.pr-state }}" \
               --arg pr_url "${{ needs.create-pr.outputs.pr-url }}" \
               '.installation_pr = {
                  "number": ($pr_number | tonumber),
                  "state": $pr_state,
                  "url": $pr_url
                }' "$REGISTRY_FILE" > "$REGISTRY_FILE.tmp"

            mv "$REGISTRY_FILE.tmp" "$REGISTRY_FILE"
          else
            echo "Registry file doesn't exist yet, creating full registry entry..."

            # Create a complete registry entry to prevent "new format" message on first run
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            cat > "$REGISTRY_FILE" << EOF
          {
            "org": "${{ inputs.org }}",
            "repo": "${{ inputs.repo }}",
            "name": "${{ inputs.repo }}",
            "team": "",
            "score": 0,
            "rank": "bronze",
            "last_updated": "$TIMESTAMP",
            "has_api": false,
            "checks_hash": "",
            "checks_count": 0,
            "installed": false,
            "default_branch": "${{ steps.fetch-branch.outputs.default_branch }}",
            "installation_pr": {
              "number": ${{ needs.create-pr.outputs.pr-number }},
              "state": "${{ needs.create-pr.outputs.pr-state }}",
              "url": "${{ needs.create-pr.outputs.pr-url }}"
            }
          }
          EOF
          fi

          echo "✅ Registry updated"
          cat "$REGISTRY_FILE"

      - name: Commit and push registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "registry/${{ inputs.org }}/${{ inputs.repo }}.json"

          if git diff --staged --quiet; then
            echo "No changes to registry, skipping commit"
          else
            git commit -m "Update registry: Add installation PR for ${{ inputs.org }}/${{ inputs.repo }}

          Installation PR #${{ needs.create-pr.outputs.pr-number }} created

          Co-Authored-By: GitHub Actions <github-actions[bot]@users.noreply.github.com>"

            git push origin ${{ inputs.scorecards-branch }}
            echo "✅ Registry update pushed to catalog branch"
          fi

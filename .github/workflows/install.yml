name: Scorecards Installation Workflow

on:
  workflow_call:
    inputs:
      scorecards-repo:
        description: 'Central scorecards repository (owner/repo)'
        required: false
        type: string
        default: 'feddericovonwernich/scorecards'
      scorecards-branch:
        description: 'Branch to commit results to in central repo'
        required: false
        type: string
        default: 'catalog'
      retry-closed:
        description: 'Create a new installation PR after a previous PR was closed'
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        description: 'GitHub token for basic operations'
        required: true
      scorecards-catalog-token:
        description: 'Token for writing results to catalog branch (repo scope)'
        required: true
      scorecards-workflow-token:
        description: 'Token for dispatching and reading central installation workflow runs'
        required: true

jobs:
  check-status:
    name: Check Installation Status
    runs-on: ubuntu-latest
    outputs:
      installed: ${{ steps.check.outputs.installed }}
      create-pr: ${{ steps.check.outputs.create-pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check installation status
        id: check
        run: |
          if [ -f ".github/workflows/scorecards.yml" ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "create-pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "create-pr=true" >> "$GITHUB_OUTPUT"
          fi

  request-installation-pr:
    name: Create Installation PR
    runs-on: ubuntu-latest
    needs: check-status
    if: needs.check-status.outputs.installed == 'false'
    outputs:
      pr-number: ${{ steps.result.outputs.pr-number }}
      pr-state: ${{ steps.result.outputs.pr-state }}
      pr-url: ${{ steps.result.outputs.pr-url }}
      status: ${{ steps.result.outputs.status }}
      message: ${{ steps.result.outputs.message }}
    steps:
      - name: Dispatch and await central owner
        id: result
        env:
          GH_TOKEN: ${{ secrets.scorecards-workflow-token }}
          SCORECARDS_REPO: ${{ inputs.scorecards-repo }}
          SCORECARDS_BRANCH: ${{ inputs.scorecards-branch }}
          RETRY_CLOSED: ${{ inputs.retry-closed }}
          POLL_ATTEMPTS: 60
          POLL_INTERVAL_SECONDS: 5
        run: |
          request_id="scorecards-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch=$(gh api "repos/$SCORECARDS_REPO" --jq .default_branch)
          gh workflow run create-installation-pr.yml --repo "$SCORECARDS_REPO" --ref "$branch" \
            -f org="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -f scorecards-repo="$SCORECARDS_REPO" \
            -f scorecards-branch="$SCORECARDS_BRANCH" \
            -f retry-closed="$RETRY_CLOSED" \
            -f request-id="$request_id"
          for _ in $(seq 1 "$POLL_ATTEMPTS"); do
            runs=$(gh run list --repo "$SCORECARDS_REPO" --workflow create-installation-pr.yml \
              --event workflow_dispatch --json databaseId,status,conclusion,displayTitle --limit 100)
            matches=$(jq --arg title "scorecards-install:$request_id" '[.[] | select(.displayTitle == $title)]' <<<"$runs")
            [ "$(jq length <<<"$matches")" -le 1 ] || {
              echo "Multiple central installation runs matched request $request_id" >&2
              exit 1
            }
            run_id=$(jq -r 'if length == 1 then .[0].databaseId else empty end' <<<"$matches")
            [ -n "$run_id" ] || { sleep "$POLL_INTERVAL_SECONDS"; continue; }
            run=$(gh run view "$run_id" --repo "$SCORECARDS_REPO" --json status,conclusion)
            [ "$(jq -r .status <<<"$run")" = completed ] || { sleep "$POLL_INTERVAL_SECONDS"; continue; }
            [ "$(jq -r .conclusion <<<"$run")" = success ] || {
              echo "Central installation workflow ended $(jq -r .conclusion <<<"$run")" >&2
              exit 1
            }
            gh run download "$run_id" --repo "$SCORECARDS_REPO" \
              --name "installation-pr-result-$request_id" --dir result
            jq -r '"pr-number=" + .pr_number, "pr-state=" + .pr_state, "pr-url=" + .pr_url, "status=" + .status, "message=" + .message' \
              result/installation-pr-result.json >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Timed out waiting for central installation workflow" >&2
          exit 1
  run-scorecards:
    name: Calculate Scorecards
    runs-on: ubuntu-latest
    needs: [check-status, request-installation-pr]
    if: |
      always() &&
      needs.check-status.outputs.installed == 'false' &&
      !cancelled()
    outputs:
      score: ${{ steps.final-outputs.outputs.score }}
      rank: ${{ steps.final-outputs.outputs.rank }}
      passed-checks: ${{ steps.final-outputs.outputs.passed-checks }}
      total-checks: ${{ steps.final-outputs.outputs.total-checks }}
      results-file: ${{ steps.final-outputs.outputs.results-file }}
    env:
      PR_NUMBER: ${{ needs.request-installation-pr.outputs.pr-number }}
      PR_STATE: ${{ needs.request-installation-pr.outputs.pr-state }}
      PR_URL: ${{ needs.request-installation-pr.outputs.pr-url }}
    steps:
      - name: Checkout service repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: service

      - name: Checkout Scorecards platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.scorecards-repo }}
          # Resolve the central default branch rather than assuming its name.
          token: ${{ secrets.scorecards-catalog-token }}
          path: .scorecards-platform
          persist-credentials: false

      - name: Run Scorecards Action
        id: scorecards
        uses: ./.scorecards-platform/action
        with:
          github-token: ${{ secrets.scorecards-catalog-token }}
          scorecards-repo: ${{ inputs.scorecards-repo }}
          scorecards-branch: ${{ inputs.scorecards-branch }}
          service-workspace: ${{ github.workspace }}/service

      - name: Set final outputs
        id: final-outputs
        run: |
          echo "score=${{ steps.scorecards.outputs.score }}" >> $GITHUB_OUTPUT
          echo "rank=${{ steps.scorecards.outputs.rank }}" >> $GITHUB_OUTPUT
          echo "passed-checks=${{ steps.scorecards.outputs.passed-checks }}" >> $GITHUB_OUTPUT
          echo "total-checks=${{ steps.scorecards.outputs.total-checks }}" >> $GITHUB_OUTPUT
          echo "results-file=${{ steps.scorecards.outputs.results-file }}" >> $GITHUB_OUTPUT

      - name: Display Results
        run: |
          echo "## 🎯 Scorecards Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY


          echo "**Score**: ${{ steps.final-outputs.outputs.score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "**Rank**: ${{ steps.final-outputs.outputs.rank }}" >> $GITHUB_STEP_SUMMARY
          echo "**Checks**: ${{ steps.final-outputs.outputs.passed-checks }}/${{ steps.final-outputs.outputs.total-checks }} passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results committed to catalog** ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.check-status.outputs.installed }}" = "false" ]; then
            echo "> ℹ️  **Note**: Scorecards workflow is not yet installed in this repository." >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.request-installation-pr.result }}" = "success" ]; then
              if [ "${{ needs.request-installation-pr.outputs.status }}" = "success" ]; then
                echo "> An [installation PR](${{ needs.request-installation-pr.outputs.pr-url }}) was created to add the workflow file." >> $GITHUB_STEP_SUMMARY
              elif [ "${{ needs.request-installation-pr.outputs.pr-state }}" = "OPEN" ]; then
                echo "> Reusing the existing [installation PR](${{ needs.request-installation-pr.outputs.pr-url }})." >> $GITHUB_STEP_SUMMARY
              elif [ -n "${{ needs.request-installation-pr.outputs.pr-state }}" ]; then
                echo "> Previous installation PR is ${{ needs.request-installation-pr.outputs.pr-state }}; it was respected because retry-closed was not requested." >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "> Installation PR creation did not complete successfully; inspect workflow runs and pull requests before retrying." >> $GITHUB_STEP_SUMMARY
            fi
            echo "> Your scores are already being tracked in the [central catalog](https://github.com/${{ inputs.scorecards-repo }}/tree/${{ inputs.scorecards-branch }})!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Display detailed results if available
          if [ -f "${{ steps.final-outputs.outputs.results-file }}" ]; then
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>📊 Detailed Check Results</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat "${{ steps.final-outputs.outputs.results-file }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecards-results
          path: ${{ steps.final-outputs.outputs.results-file }}
          retention-days: 1

  update-installation-pr:
    name: Update Installation PR with Results
    runs-on: ubuntu-latest
    needs: [check-status, request-installation-pr, run-scorecards]
    if: |
      needs.check-status.outputs.installed == 'false' &&
      needs.request-installation-pr.result == 'success' &&
      needs.request-installation-pr.outputs.status == 'success' &&
      needs.request-installation-pr.outputs.pr-state == 'OPEN' &&
      needs.run-scorecards.result == 'success'
    steps:
      - name: Checkout service repository
        uses: actions/checkout@v4

      - name: Update Pull Request with Results
        env:
          GH_TOKEN: ${{ secrets.scorecards-workflow-token }}
        run: |
          # Determine PR number from either existing or newly created PR
          PR_NUMBER="${{ needs.request-installation-pr.outputs.pr-number }}"

          # Create updated PR body with results
          cat > pr-body.md << 'EOF'
          ## 🎯 Scorecards Quality Monitoring

          This PR adds automated quality monitoring using Scorecards.

          ### What's Included

          - **Workflow file**: `.github/workflows/scorecards.yml` - Runs daily to calculate quality scores
          - **Config file**: `.scorecard/config.yml` - Service metadata and configuration

          ### Current Score

          **Score**: ${{ needs.run-scorecards.outputs.score }}/100
          **Rank**: ${{ needs.run-scorecards.outputs.rank }}
          **Checks Passed**: ${{ needs.run-scorecards.outputs.passed-checks }}/${{ needs.run-scorecards.outputs.total-checks }}

          ### What Happens After Merge

          Once merged, scorecards will:
          - ✅ Run daily via cron schedule (configurable)
          - ✅ Post results to the central catalog
          - ✅ Generate quality badges for your README
          - ✅ Track score trends over time

          ### Customize Your Config

          Edit `.scorecard/config.yml` to add:
          - Team name
          - Service description
          - Links to documentation
          - OpenAPI spec location (if applicable)

          ### Learn More

          - [Scorecards Documentation](https://github.com/${{ inputs.scorecards-repo }})
          - [View Catalog](https://github.com/${{ inputs.scorecards-repo }}/tree/${{ inputs.scorecards-branch }})

          ---

          🤖 This PR was automatically created by the Scorecards installation workflow.
          If you close this PR without merging, we'll respect your decision and won't create another one.
          However, scorecards will continue to run daily and results will be available in the Actions tab.
          EOF

          # Update the PR description
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

          echo "✅ Updated installation PR #$PR_NUMBER with scorecard results"

      - name: Cleanup
        if: always()
        run: |
          rm -f pr-body.md

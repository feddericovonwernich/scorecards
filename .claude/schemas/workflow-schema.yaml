# JSON Schema for workflow.yaml validation
# This schema defines the structure and validation rules for workflow configuration files
$schema: http://json-schema.org/draft-07/schema#
# Local identifier for schema references (not a resolvable URL)
$id: urn:claude-workflow:schema:workflow:v1
title: Workflow Configuration Schema
description: Schema for validating Claude workflow configuration files
type: object
required:
  - name
  - description
  - version
properties:
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: Workflow identifier in kebab-case
    minLength: 3
    maxLength: 50
    examples:
      - requirements-to-specs
      - technical-planning
      - database-migration
  
  description:
    type: string
    description: Human-readable description of the workflow's purpose
    minLength: 10
    maxLength: 500
  
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: Semantic version (X.Y.Z)
    examples:
      - "1.0.0"
      - "2.1.3"
  
  parameters:
    oneOf:
      - type: object
        description: Parameters as object with nested properties
        patternProperties:
          "^[A-Z][A-Z0-9_]*$":
            $ref: "#/definitions/parameterObject"
        additionalProperties: false
      - type: array
        description: Parameters as array of parameter objects
        items:
          $ref: "#/definitions/parameterArray"
        minItems: 0
        uniqueItems: true
  
  phases:
    type: object
    description: Phase execution configuration
    properties:
      require_confirmation:
        type: boolean
        description: Require user confirmation before each phase
        default: false
      
      allow_retry:
        type: boolean
        description: Allow retrying failed phases
        default: true
      
      generate_logs:
        type: boolean
        description: Generate execution.log file
        default: true
      
      stop_on_failure:
        type: boolean
        description: Stop workflow on phase failure
        default: true
      
      parallel_execution_supported:
        type: boolean
        description: Workflow contains phases that support parallel execution
        default: false

      default_model:
        type: string
        description: Default Claude model for phase execution (can be overridden per-phase)
        enum:
          - opus
          - sonnet
          - haiku
        default: sonnet
        examples:
          - sonnet
          - opus

    additionalProperties: false

  loops:
    type: array
    description: Loop configurations for iterative phase execution
    items:
      type: object
      required:
        - name
        - phases
        - max_iterations
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: Loop identifier in kebab-case
          minLength: 3
          maxLength: 50
          examples:
            - refinement-loop
            - quality-gate
            - convergence-test

        description:
          type: string
          description: Human-readable purpose of this loop
          minLength: 10
          maxLength: 200

        phases:
          type: array
          description: Phase numbers in loop body (e.g., [2, 3, 4])
          items:
            type: integer
            minimum: 0
            maximum: 99
          minItems: 1
          uniqueItems: true
          examples:
            - [2, 3]
            - [1, 2, 3, 4]

        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
          description: Safety limit - maximum loop iterations allowed
          default: 10

        iterations:
          type: integer
          minimum: 1
          description: Fixed iteration count (run exactly N times)

        allow_phase_control:
          type: boolean
          default: true
          description: Allow phases to override loop continuation via LOOP_CONTINUE parameter

        exit_condition:
          type: object
          description: Optional declarative exit condition evaluated by orchestrator after each iteration
          required:
            - expression
          properties:
            expression:
              type: string
              minLength: 3
              maxLength: 500
              description: "Boolean expression using parameter references ($PARAM) and operators (==, !=, <, >, <=, >=, &&, ||, !)"
              examples:
                - "$CONVERGENCE_DELTA < $CONVERGENCE_THRESHOLD"
                - "$ERROR_COUNT == 0 && $QUALITY_SCORE >= 95"
                - "!$HAS_ERRORS"

            description:
              type: string
              minLength: 5
              maxLength: 200
              description: Human-readable explanation of the exit criteria
              examples:
                - "Exit when convergence achieved"
                - "Exit when all tests pass and quality threshold met"

          additionalProperties: false

      # Validation: exit_condition and iterations are mutually exclusive
      oneOf:
        - required: [exit_condition]
          not:
            required: [iterations]
        - required: [iterations]
          not:
            required: [exit_condition]
        - not:
            anyOf:
              - required: [exit_condition]
              - required: [iterations]

      additionalProperties: false

  task_iteration:
    type: object
    description: Optional task-level iteration configuration for large task lists
    properties:
      enabled:
        type: boolean
        default: false
        description: Enable task iteration mode for specified phase

      phase:
        type: integer
        minimum: 0
        maximum: 99
        description: Phase number that should iterate over tasks

      task_index_param:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        default: TASK_INDEX_PATH
        description: Parameter name containing path to task index file

      task_id_param:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        default: TASK_ID
        description: Parameter name to pass current task ID

      task_dir:
        type: string
        default: tasks
        description: Directory containing task definition files

      result_dir:
        type: string
        default: results
        description: Directory for task result files

      max_retries_per_task:
        type: integer
        minimum: 0
        maximum: 5
        default: 0
        description: Number of retries for failed tasks

      stop_on_failure:
        type: boolean
        default: false
        description: Stop all task iteration if any task fails

      sequential:
        type: boolean
        default: true
        description: Execute tasks sequentially (vs parallel)

    required:
      - enabled
      - phase

    additionalProperties: false

  metadata:
    type: object
    description: Workflow metadata and documentation
    properties:
      generated_from:
        type: array
        description: Source files used to generate this workflow
        items:
          type: string
        minItems: 0
      
      generated_date:
        type: string
        description: ISO date when workflow was generated
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      
      workflow_type:
        type: string
        description: Category of workflow
        enum:
          - deployment
          - testing
          - migration
          - build
          - data-processing
          - requirements-processing
          - technical-planning
          - setup
          - automation
      
      complexity:
        type: string
        description: Workflow complexity level
        enum:
          - simple
          - medium
          - complex
      
      supported_agents:
        type: array
        description: List of specialized agents used by this workflow
        items:
          type: string
        minItems: 0
        uniqueItems: true
      
      architecture_notes:
        type: array
        description: Important architectural constraints or notes
        items:
          type: string
        minItems: 0
    
    additionalProperties: true

additionalProperties: false

definitions:
  parameterObject:
    type: object
    required:
      - type
      - description
    properties:
      type:
        type: string
        enum:
          - string
          - boolean
          - integer
          - number
          - enum
          - file
          - directory
          - array
        description: Parameter data type
      
      required:
        type: boolean
        description: Whether this parameter is required
        default: false
      
      description:
        type: string
        description: Human-readable description of the parameter
        minLength: 5
        maxLength: 200
      
      default:
        description: Default value if not provided
      
      enum:
        type: array
        description: Valid values for enum type
        items:
          type: string
        minItems: 2
        uniqueItems: true
      
      example:
        description: Example value for documentation
      
      min:
        type: number
        description: Minimum value for integer/number types
      
      max:
        type: number
        description: Maximum value for integer/number types
      
      pattern:
        type: string
        description: Regex pattern for string validation
    
    allOf:
      - if:
          properties:
            type:
              const: enum
          required:
            - type
        then:
          required:
            - enum

    additionalProperties: false

  parameterArray:
    type: object
    required:
      - name
      - type
      - description
    properties:
      name:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        description: Parameter name in UPPER_SNAKE_CASE
      
      type:
        type: string
        enum:
          - string
          - boolean
          - integer
          - number
          - enum
          - file
          - directory
          - array
        description: Parameter data type
      
      required:
        type: boolean
        description: Whether this parameter is required
        default: false
      
      description:
        type: string
        description: Human-readable description of the parameter
        minLength: 5
        maxLength: 200
      
      default:
        description: Default value if not provided
      
      enum:
        type: array
        description: Valid values for enum type
        items:
          type: string
        minItems: 2
        uniqueItems: true
      
      example:
        description: Example value for documentation

    allOf:
      - if:
          properties:
            type:
              const: enum
          required:
            - type
        then:
          required:
            - enum

    additionalProperties: false
# Example: How to use the Scorecards Installation Workflow in your service repository
#
# This workflow can be added to any service repository to:
# 1. Automatically run scorecards daily
# 2. Request central installation PR creation when not already installed
# 3. Display results in GitHub Actions UI
# 4. Record score provenance from the trusted Scorecards checkout
#
# Save this file as: .github/workflows/scorecards-check.yml

name: Scorecards Check

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual triggering
  workflow_dispatch:

  # Optional: Also run on pushes to main (for faster feedback)
  # push:
  #   branches:
  #     - main

jobs:
  scorecards:
    name: Run Scorecards
    # Call the reusable installation workflow from the scorecards repository
    uses: feddericovonwernich/scorecards/.github/workflows/install.yml@main
    with:
      # Optional: Override the default scorecards repository
      scorecards-repo: 'feddericovonwernich/scorecards'

      # Optional: Override the default branch for results (default: 'catalog')
      scorecards-branch: 'catalog'
    secrets:
      # Required: service-to-central checkout and catalog publication.
      scorecards-catalog-token: ${{ secrets.SCORECARDS_CATALOG_TOKEN }}

      # Required: dispatch/read the central owner and update a newly created PR.
      scorecards-workflow-token: ${{ secrets.SCORECARDS_WORKFLOW_TOKEN }}
# What happens when this runs:
#
# 1. First Run (not installed):
#    - Checks whether .github/workflows/scorecards.yml exists
#    - The central owner finds no labeled installation PR
#    - Runs scorecards and displays results
#    - Records the service and Scorecards source revisions
#    - Creates a uniquely named installation PR with the workflow and config
#
# 2. Later Run (still not installed):
#    - The central owner reuses an open labeled PR without creating a branch
#    - It respects a closed or merged PR unless retry-closed: true is passed
#    - Runs scorecards and displays results
#
# 3. After the installation PR is merged:
#    - The installed scorecards.yml workflow performs regular scoring
#    - This installation workflow does not replace that workflow
#
# Remediation policy and activation: ../architecture/flows/remediation-flow.md
# Calling this reusable workflow does not grant caller tokens permissions
# in another repository.
